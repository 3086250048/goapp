services:
  goapp:
    build: .
    container_name: goapp
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:8080"
    environment:
      DATA_DIR: /data
      DEMO_MODE: "${DEMO_MODE:-1}"
      DEMO_OTP: "${DEMO_OTP:-123456}"
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      SMS_PROVIDER: "${SMS_PROVIDER:-demo}"
      ALIYUN_ACCESS_KEY_ID: "${ALIYUN_ACCESS_KEY_ID:-}"
      ALIYUN_ACCESS_KEY_SECRET: "${ALIYUN_ACCESS_KEY_SECRET:-}"
      ALIYUN_SMS_SIGN_NAME: "${ALIYUN_SMS_SIGN_NAME:-}"
      ALIYUN_SMS_TEMPLATE_CODE: "${ALIYUN_SMS_TEMPLATE_CODE:-}"
      AMAP_WEB_SERVICE_KEY: "${AMAP_WEB_SERVICE_KEY:-}"
      WECHAT_APP_ID: "${WECHAT_APP_ID:-}"
      WECHAT_APP_SECRET: "${WECHAT_APP_SECRET:-}"
      WECHAT_REDIRECT_URI: "${WECHAT_REDIRECT_URI:-}"
      QQ_APP_ID: "${QQ_APP_ID:-}"
      QQ_APP_SECRET: "${QQ_APP_SECRET:-}"
      QQ_REDIRECT_URI: "${QQ_REDIRECT_URI:-}"
    volumes:
      - goapp-data:/data

  caddy:
    image: "${CADDY_IMAGE:-caddy:2.10-alpine}"
    profiles: ["https"]
    container_name: goapp-caddy
    restart: unless-stopped
    depends_on:
      goapp:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: "${DOMAIN:-}"
      ACME_EMAIL: "${ACME_EMAIL:-}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  goapp-data:
  caddy-data:
  caddy-config:
