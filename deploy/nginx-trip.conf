# 出行 App · nginx 反向代理
# 1. 把 trip.example.com 改成你的域名
# 2. 确认应用已监听 127.0.0.1:18080
# 3. sudo certbot --nginx -d trip.example.com

server {
    listen 80;
    server_name trip.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name trip.example.com;

    ssl_certificate     /etc/letsencrypt/live/trip.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trip.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 会话、订单和数据库状态不能进入代理缓存
    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    # 如需内测口令，安装 apache2-utils 后取消注释
    # auth_basic "Trip";
    # auth_basic_user_file /etc/nginx/.htpasswd;
}
