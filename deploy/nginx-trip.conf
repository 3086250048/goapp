# 出行原型 · nginx 站点配置（配合 certbot 使用）
# 用法：
#   sudo cp nginx-trip.conf /etc/nginx/sites-available/trip
#   sudo ln -s /etc/nginx/sites-available/trip /etc/nginx/sites-enabled/trip
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d trip.example.com
# 记得把 trip.example.com 改成你的域名。

server {
    listen 80;
    server_name trip.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name trip.example.com;

    root /var/www/trip;
    index index.html;

    # certbot 首次运行后会自动填好下面两行
    ssl_certificate     /etc/letsencrypt/live/trip.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trip.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    # 让 .webmanifest 带正确的 Content-Type，否则安卓可能识别不到 PWA
    types {
        application/manifest+json webmanifest;
    }

    # 原型阶段建议开一层口令（htpasswd -c /etc/nginx/.htpasswd demo）
    # auth_basic "Trip Prototype";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # service worker 不缓存，否则更新不生效
    location = /sw.js {
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # 静态资源长缓存
    location ~* \.(?:css|js|png|jpe?g|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
